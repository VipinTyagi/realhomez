<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Google Sheet Data</title>
</head>
<body>

  <h2>Google Sheet Data</h2>
  <div id="data-container">Loading...</div>

  <script>
    const sheetUrl = 'https://docs.google.com/spreadsheets/d/1xc8wKpGaKqsiNNNo-5TGRCRJJGjhbw1Ua7V9uXBRWuw/edit?pli=1&gid=0#gid=0';

    fetch(sheetUrl)
      .then(response => response.text())
      .then(csvText => {
        const rows = csvText.split('\n').map(row => row.split(','));
        
        // Build a simple HTML table
        let tableHtml = '<table border="1">';
        rows.forEach(row => {
          tableHtml += '<tr>';
          row.forEach(cell => {
            tableHtml += `<td>${cell.trim()}</td>`;
          });
          tableHtml += '</tr>';
        });
        tableHtml += '</table>';

        document.getElementById('data-container').innerHTML = tableHtml;
      })
      .catch(error => {
        console.error('Error fetching sheet:', error);
        document.getElementById('data-container').innerText = 'Failed to load data.';
      });
  </script>

</body>
</html>
